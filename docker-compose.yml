
services:

  mongodb:
    image: mongo:8
    container_name: employee-mongodb-compose
    ports:
      - "27017:27017"
    volumes:
      - employee-mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: devops-employee-project-backend:latest
    build:
      context: ./backend
    container_name: employee-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/employee_management
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: devops-employee-project-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: employee-frontend
    ports:
      - "8090:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  employee-mongo-data:
    external: true
    name: employee-mongo-data
